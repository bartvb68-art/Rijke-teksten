# Basislab Teksten op de VPS, naast Basislab Typen en Basislab Lezen.
# De Caddy-container van Basislab Typen regelt het webadres en het slotje (https)
# en stuurt teksten.basislab.nl door naar deze container.
name: basislab-teksten

services:
  teksten:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    networks:
      - typen

networks:
  typen:
    external: true
    name: ${TYPEN_NETWERK:-deploy_default}
