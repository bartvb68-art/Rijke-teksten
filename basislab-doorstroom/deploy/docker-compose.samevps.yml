# Basislab Doorstroom op dezelfde VPS als Basislab Typen.
# De Caddy van Basislab Typen regelt HTTPS; deze app hangt aan het netwerk van die opstelling.
# Gebruik: docker compose -f docker-compose.samevps.yml up -d --build   (zie README voor de regel in de Caddyfile van Typen)
name: basislab-doorstroom

services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      SIGNUP_CODE: ${SIGNUP_CODE:?Vul SIGNUP_CODE in in het bestand .env}
      TZ_SCHOOL: ${TZ_SCHOOL:-Europe/Amsterdam}
    volumes:
      - data:/app/data
    networks:
      typen:
        aliases: [doorstroom]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  typen:
    external: true
    name: ${TYPEN_NETWORK:-deploy_default}

volumes:
  data:
